# Heat-EWS for BioHEAT. All tunable settings live here.

site:
  name: RMMCH
  # Rahima Moosa Mother and Child Hospital, Coronationville. [CHECK] Q5
  latitude: -26.176
  longitude: 27.985
  timezone: Africa/Johannesburg

# Location used for the SOP-BH-13 Appendix 1 replication check only. [CHECK]
replication_site:
  name: Soweto
  latitude: -26.25
  longitude: 27.86

reanalysis:
  source: open-meteo-archive
  model: era5            # ERA5 0.25 degree. Alternative: era5_land
  variable: temperature_2m_max

thresholds:
  # table: monthly values from table_file (default). sop: SOP-BH-13 Appendix 1. compute: from ERA5 on the fly
  source: table
  table_file: data/thresholds_rmmch_1991_2020.csv   # ERA5, RMMCH grid cell, 1991-2020 (WMO normal)
  percentile: 90          # triggers the alert. BioHEAT protocol uses P90 (Ijeoma, 21 Oct 2026)
  also_show: null         # e.g. 95 to draw a second line on the page
  reference_period: [1991, 2020]
  kind: monthly           # monthly or calendar_day (compute only)
  calendar_window_days: 15

sop_appendix1:
  # SOP-BH-13 Appendix 1, ERA5 Soweto 2016-2019, degrees C
  p90: {1: 30.7, 2: 28.9, 3: 28.7, 4: 27.0, 5: 23.7, 6: 21.8, 7: 22.4, 8: 26.0, 9: 30.1, 10: 31.7, 11: 31.0, 12: 31.0}
  p95: {1: 32.6, 2: 29.8, 3: 28.9, 4: 27.5, 5: 24.0, 6: 22.9, 7: 23.4, 8: 26.5, 9: 30.5, 10: 32.1, 11: 32.3, 12: 31.8}

alert:
  run_length_days: 2
  comparison: strict      # strict (>) per SOP example, or inclusive (>=)
  warning_days: [1, 7]          # "next 7 days"
  watch_days: [8, 14]
  # Chance of a heatwave = share of the 51 ensemble members that show one in the window
  activate_member_fraction: 0.8  # Activate: chance in days 1 to 7 at least this
  prepare_member_fraction: 0.5   # Prepare: chance in days 1 to 7 at least this
  watch_member_fraction: 0.5     # Watch: chance in days 8 to 14 at least this
  likely_day_fraction: 0.5       # a day counts towards the expected heatwave dates at this chance
  visit_days_after: 2            # SOP-BH-13 visit window: heatwave days plus up to 2 days after
  min_members: 40              # fewer than this counts as an incomplete fetch

bias:
  # mean_shift (default) or quantile_mapping. Mean shift keeps hot days hot; see outputs/correction_comparison.csv
  method: mean_shift

forecast:
  source: open-meteo-ensemble
  model: ecmwf_ifs025
  horizon_days: 14

notify:
  # on_change: only when the status changes
  # alerts: on change, and every day while there is a Watch or Warning
  # daily_digest: every day
  mode: alerts
  # Daily email for everyone up to and including this date (first week), then `mode` applies
  daily_until: 2026-10-27
  # Addresses live in the GitHub secrets HEATEWS_RECIPIENTS and HEATEWS_TEST_RECIPIENTS
  # (comma-separated) so they are not public. These lists are only a fallback.
  recipients: []
  test_recipients: []
