name: Rebuild thresholds and bias correction

# Run by hand (Actions, Rebuild..., Run workflow), e.g. once a year or after changing thresholds.
# Pulls ERA5, rebuilds and checks the thresholds, refits the bias correction, reruns validation,
# and commits data/bias_mapping.json and outputs/.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-alert
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: make install era5 stations thresholds bias validate test
      - name: Commit results
        run: |
          git config user.name "heat-ews bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bias_mapping.json data/previous_runs/ outputs/
          git commit -m "Rebuild thresholds and bias correction $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase -q
          git push
