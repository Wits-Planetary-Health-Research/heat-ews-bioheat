name: Schedule probe (temporary)

# Diagnostic only: checks that GitHub fires scheduled runs on this repo. No email, no commits.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "event=${{ github.event_name }} at $(date -u +%FT%TZ)"
