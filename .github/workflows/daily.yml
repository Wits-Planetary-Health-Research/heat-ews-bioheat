name: Daily heat alert

on:
  schedule:
    - cron: "13 5 * * *"   # 07:13 SAST every day
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send email to test recipients only"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run alert
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.EWS_RH }}   # the Gmail app password is stored as EWS_RH
          SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
          HEATEWS_PAGE_URL: ${{ vars.HEATEWS_PAGE_URL }}
          HEATEWS_TEST: ${{ inputs.test_email && '1' || '0' }}
        run: python -m heatews.run
      - name: Save status and run log
        run: |
          git config user.name "heat-ews bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git commit -m "Daily run $(date -u +%F)" || echo "nothing to commit"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
