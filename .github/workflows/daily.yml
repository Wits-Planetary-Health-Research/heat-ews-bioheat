name: Daily heat alert

on:
  schedule:
    # GitHub can skip or delay scheduled runs, so there are three slots each morning.
    # The first one that gets a good forecast does the day's run; later slots see that and stop.
    - cron: "13 5 * * *"   # 07:13 SAST
    - cron: "17 6 * * *"   # 08:17 SAST, backup
    - cron: "41 7 * * *"   # 09:41 SAST, backup
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send email to test recipients only"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run alert
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.EWS_RH }}   # the Gmail app password is stored as EWS_RH
          SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
          HEATEWS_PAGE_URL: ${{ vars.HEATEWS_PAGE_URL }}
          HEATEWS_TEST: ${{ inputs.test_email && '1' || '0' }}
          HEATEWS_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
          HEATEWS_RECIPIENTS: ${{ secrets.HEATEWS_RECIPIENTS }}
          HEATEWS_TEST_RECIPIENTS: ${{ secrets.HEATEWS_TEST_RECIPIENTS || secrets.SMTP_USER }}
        run: python -m heatews.run
      - name: Save status and run log
        run: |
          git config user.name "heat-ews bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git commit -m "Daily run $(date -u +%F)" || echo "nothing to commit"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
